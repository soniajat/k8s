apiVersion: apps/v1
kind: Deployment
metadata:
  name: web-deploy
  labels:
    app: web-deploy
spec:
  replicas: 3                  # change and re-apply to scale (or use kubectl scale)
  selector:
    matchLabels:
      app: web-deploy          # must match template labels (selector is immutable after creation)
  template:
    metadata:
      labels:
        app: web-deploy        # Services select pods by this label
    spec:
      containers:
        - name: nginx
          image: nginx:1.25    # pin a tag so updates are explicit; avoid :latest
          ports:
            - containerPort: 80